# CI for Harbor (download-manager/). Path-filtered so the other projects in this
# repository (Murmur, Clarion) neither trigger nor are affected by it.
name: Harbor

on:
  push:
    # With only `tags` listed, GitHub would skip branch pushes entirely, so list both.
    # Path filters apply to branch pushes only; any v* tag cuts a release (see the release job).
    branches: ['**']
    paths: ['download-manager/**', '.github/workflows/fetchline.yml']
    tags: ['v*']
  pull_request:
    paths: ['download-manager/**', '.github/workflows/fetchline.yml']
  schedule:
    - cron: '30 3 * * *' # nightly: public download test + browser-compat check
  workflow_dispatch:

defaults:
  run:
    working-directory: download-manager

jobs:
  unit-and-engine:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Unit tests
        run: npm test
      - name: Engine end-to-end (local range server, kill/restart, corruption check)
        run: node --disable-warning=ExperimentalWarning scripts/verify.ts --local
      - name: Public download vs published SHA-256 (nightly only)
        if: github.event_name == 'schedule'
        run: node --disable-warning=ExperimentalWarning scripts/verify.ts --public

  extension:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Extension in headless Edge (video button, HLS, AB DM hand-off stand-in)
        shell: pwsh
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          node --disable-warning=ExperimentalWarning scripts/verify-extension.ts
      - name: Store build has no yt-dlp code
        run: node scripts/build.ts --check-store
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: extension-screenshots, path: download-manager/data/verify-ext/*.png }

  tray:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Windows tray app
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-tray.ps1

  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Harbor-Setup.exe (bundles this Node runtime)
        shell: pwsh
        run: |
          $env:ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          npm run installer
      - name: Install, run, upgrade, uninstall
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-installer.ps1
      - uses: actions/upload-artifact@v4
        with: { name: harbor-installer, path: 'download-manager/dist/Harbor-Setup-*.exe' }

  # Cuts a GitHub Release when a version tag (v*) is pushed: builds the installer and the
  # extension/app zips, then attaches them. The installer is signed once the owner adds the
  # WINDOWS_SIGN_PFX (base64 .pfx) and WINDOWS_SIGN_PASSWORD secrets; until then it ships unsigned.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-and-engine, installer]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.WINDOWS_SIGN_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build zips + checksums
        run: node --disable-warning=ExperimentalWarning scripts/build.ts
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $env:ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          npm run installer
      - name: Sign installer (skipped until the signing secrets exist)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
            $exe = Get-ChildItem dist/Harbor-Setup-*.exe | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGN_PASSWORD $exe.FullName
            if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa $exe.FullName
            if ($LASTEXITCODE) { throw "signtool verify failed ($LASTEXITCODE)" }
            # Signing changes the bytes, so refresh the installer's line in SHA256SUMS.txt.
            $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            $sums = Get-Content dist/SHA256SUMS.txt | Where-Object { $_ -and -not $_.EndsWith($exe.Name) }
            @($sums) + "$sha  $($exe.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $notes = "dist/RELEASE_NOTES-$v.md"
          if (!(Test-Path $notes)) { "Harbor $v" | Out-File $notes }
          gh release create "${{ github.ref_name }}" `
            --title "Harbor $v" --notes-file $notes `
            (Get-ChildItem dist/Harbor-Setup-*.exe, dist/*.zip, dist/SHA256SUMS.txt | ForEach-Object FullName)
