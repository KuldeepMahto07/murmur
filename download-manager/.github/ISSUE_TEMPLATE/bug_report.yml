name: Bug report
description: Something in Harbor isn't working right.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Harbor. Please don't paste download URLs or file names — the diagnostics below contain none.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: A download stalls at 99% and never finishes…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a download
        2. Pause it at ~50%
        3. Resume — it restarts from 0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Downloading / resume
        - Browser button / extension
        - Video download
        - Queue / scheduler
        - Installer / startup
        - Pro / licence
        - Something else
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: 'In Harbor: Settings → Help → Copy Diagnostics, then paste here. It has versions and counts only — no URLs or file names.'
      render: text
    validations:
      required: false
