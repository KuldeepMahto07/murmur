<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --tint: #007aff; --green: #34c759; --red: #ff3b30; --bg: #f2f2f7; --surface: #fff; --label: #000; --label-2: rgba(60,60,67,.6);
      --sep: rgba(60,60,67,.16); --fill: rgba(120,120,128,.12); color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --tint: #0a84ff; --green: #30d158; --red: #ff453a; --bg: #000; --surface: #1c1c1e; --label: #fff; --label-2: rgba(235,235,245,.6);
        --sep: rgba(84,84,88,.6); --fill: rgba(120,120,128,.28); }
    }
    * { box-sizing: border-box; }
    body { width: 350px; margin: 0; padding: 14px 14px 16px; font: 13px/1.38 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--label); -webkit-font-smoothing: antialiased; }
    h1 { display: flex; align-items: center; gap: 10px; font: 700 20px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', sans-serif; letter-spacing: -.4px; margin: 2px 2px 4px; }
    h1 img { width: 28px; height: 28px; border-radius: 7px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .status { display: block; margin: 0 2px 6px 40px; font-size: 12px; font-weight: 500; }
    .status::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: currentColor; vertical-align: 1px; }
    .ok { color: var(--green); } .bad { color: var(--red); }
    h2 { font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .3px; color: var(--label-2); margin: 16px 14px 6px; }
    #list { background: var(--surface); border-radius: 12px; overflow: hidden; }
    #list.muted { padding: 12px 14px; }
    .row { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 9px 14px; cursor: pointer; position: relative; font: inherit; }
    .row + .row::before { content: ''; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
    .row:hover { background: var(--fill); }
    .row.blocked { opacity: .6; cursor: default; }
    .row .s { color: var(--label-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.sent::after { content: '✓ Sent'; position: absolute; right: 14px; top: 10px; color: var(--green); font-size: 12px; font-weight: 600; }
    .muted { color: var(--label-2); }
    /* settings rendered as grouped cells */
    body > label, .sub label { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; padding: 6px 14px; margin: 0; background: var(--surface); position: relative; cursor: pointer; }
    body > label + label::before, body > label + .sub label::before, .sub + label::before { content: ''; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
    h2 + label { border-radius: 12px 12px 0 0; }
    body > label:has(+ h2), body > label:has(+ button), body > label:has(+ .sub[hidden] + h2), .sub:has(+ h2) label:last-child, .sub:has(+ button) label:last-child { border-radius: 0 0 12px 12px; }
    .sub { display: block; }
    .sub label { padding-left: 28px; font-size: 12.5px; color: var(--label-2); cursor: default; }
    .sub[hidden] { display: none; }
    .sub.muted { background: var(--surface); padding: 0 14px 10px 28px; font-size: 12px; }
    input[type=radio] { appearance: none; width: 16px; height: 16px; margin: 0; order: 2; }
    input[type=radio]:checked::after { content: '✓'; color: var(--tint); font-size: 16px; font-weight: 600; line-height: 16px; }
    input[type=checkbox] { appearance: none; order: 2; width: 42px; height: 26px; border-radius: 99px; background: var(--fill); position: relative; cursor: pointer; transition: background .2s; flex: none; }
    input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .28s cubic-bezier(.3,1.35,.6,1); }
    input[type=checkbox]:checked { background: var(--green); }
    input[type=checkbox]:checked::after { transform: translateX(16px); }
    input[type=number], input[type=password] { order: 2; width: 110px; height: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: var(--fill); color: inherit; font: inherit; text-align: right; }
    .open { width: 100%; height: 40px; margin-top: 16px; border: 0; border-radius: 12px; color: #fff; font: 600 14px inherit; cursor: pointer; background: var(--tint); box-shadow: 0 6px 18px rgba(0,122,255,.3); }
    .open:hover { filter: brightness(1.07); }
  </style>
</head>
<body>
  <h1><img src="icons/32.png" alt="" /> Fetchline <span id="status" class="status"></span></h1>
  <h2>Media on this tab</h2>
  <div id="list" class="muted">…</div>
  <h2>Send downloads to</h2>
  <label><input type="radio" name="target" value="fetchline" /> Fetchline</label>
  <div class="sub" data-for="fetchline"><label>Engine port <input type="number" id="port" min="1" max="65535" /></label></div>
  <label><input type="radio" name="target" value="abdm" /> AB Download Manager</label>
  <div class="sub" data-for="abdm">
    <label>Port <input type="number" id="abdmPort" min="1" max="65535" /></label>
    <label>API key <input type="password" id="abdmKey" placeholder="only if set in AB DM" /></label>
  </div>
  <h2>Options</h2>
  <!-- @ytdlp:start -->
  <label><input type="checkbox" id="ytdlp" /> Download from video sites (YouTube, Instagram…)</label>
  <div class="sub muted" id="ytdlpStatus"></div>
  <!-- @ytdlp:end -->
  <label><input type="checkbox" id="takeover" /> Take over normal browser downloads</label>
  <button class="open" id="open">Open Fetchline</button>
  <script src="popup.js"></script>
</body>
</html>
