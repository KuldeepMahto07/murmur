<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; padding: 12px 14px; font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; background: #151a23; color: #e6eaf2; }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0 0 10px; }
    h1 img { width: 20px; height: 20px; }
    .status { margin-left: auto; font-size: 12px; font-weight: 500; }
    .ok { color: #34d399; } .bad { color: #f87171; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #8a94a8; margin: 12px 0 4px; }
    .row { display: block; width: 100%; text-align: left; background: #1c2330; border: 1px solid #2a3344; color: inherit; padding: 7px 9px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; }
    .row:hover { border-color: #14b8a6; }
    .row.blocked { opacity: .65; cursor: default; }
    .row .s { color: #8a94a8; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.sent::after { content: '✓ sent'; color: #34d399; font-size: 12px; }
    .muted { color: #8a94a8; }
    label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    .sub { margin-left: 24px; }
    .sub[hidden] { display: none; }
    input[type=password] { width: 150px; background: #1c2330; border: 1px solid #2a3344; color: inherit; border-radius: 6px; padding: 3px 6px; }
    input[type=number] { width: 80px; background: #1c2330; border: 1px solid #2a3344; color: inherit; border-radius: 6px; padding: 3px 6px; }
    .open { width: 100%; margin-top: 8px; padding: 7px; border: 0; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #14b8a6, #6366f1); }
  </style>
</head>
<body>
  <h1><img src="icons/32.png" alt="" /> Fetchline <span id="status" class="status"></span></h1>
  <h2>Media on this tab</h2>
  <div id="list" class="muted">…</div>
  <h2>Send downloads to</h2>
  <label><input type="radio" name="target" value="fetchline" /> Fetchline</label>
  <div class="sub" data-for="fetchline"><label>Engine port <input type="number" id="port" min="1" max="65535" /></label></div>
  <label><input type="radio" name="target" value="abdm" /> AB Download Manager</label>
  <div class="sub" data-for="abdm">
    <label>Port <input type="number" id="abdmPort" min="1" max="65535" /></label>
    <label>API key <input type="password" id="abdmKey" placeholder="only if set in AB DM" /></label>
  </div>
  <h2>Options</h2>
  <label><input type="checkbox" id="takeover" /> Take over normal browser downloads</label>
  <button class="open" id="open">Open Fetchline</button>
  <script src="popup.js"></script>
</body>
</html>
